name: Generate PDS Namespace Registry PDF and XLSX Files

# Trigger when pds-namespace-registry.csv is changed on main branch
on:
  push:
    branches:
      - main
    paths:
      - 'docs/namespace-registry/pds-namespace-registry.csv'
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  generate-files:
    runs-on: ubuntu-latest
    # Prevent infinite loops if bot user triggers workflow
    if: github.actor != 'pdsen-ci'

    # Grant write permissions to push changes back
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use admin token to bypass branch protection rules
          token: ${{ secrets.ADMIN_GITHUB_TOKEN || github.token }}
          # Fetch at least the immediate parents for context
          fetch-depth: 2

      - name: Install dependencies
        run: |
          pip install --quiet 'openpyxl~=3.1.5' 'reportlab~=4.5.1'

      - name: Run generation script
        run: |
          python scripts/generate-namespace-registry-files.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain docs/namespace-registry/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "pdsen-ci@jpl.nasa.gov"
          git config --local user.name "PDSEN CI Bot"
          git add docs/namespace-registry/pds-namespace-registry.xlsx docs/namespace-registry/pds-namespace-registry.pdf
          git commit -m "Auto-generated namespace registry files from CSV by PDSEN CI Bot [skip ci]"
          git push origin HEAD

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namespace-registry-files
          path: |
            docs/namespace-registry/pds-namespace-registry.xlsx
            docs/namespace-registry/pds-namespace-registry.pdf
          retention-days: 90
